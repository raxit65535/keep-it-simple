name: Quarto site
on:
  pull_request:
  push:
    branches: [main, release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quarto-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      quarto-version: ${{ steps.quarto-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --frozen
      - id: quarto-version
        shell: bash
        run: |
          uv run python - <<'PY'
          import os
          import re
          from pathlib import Path
          version = Path('.quarto-version').read_text().strip()
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('Invalid pinned Quarto version')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\n')
          PY
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ steps.quarto-version.outputs.version }}
      - run: uv run pytest -q
      - run: uv run ruff check .
      - run: uv run python -m tools.build_site
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: quarto-site
          path: docs/_site/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  deploy:
    needs: validate
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: github-pages-publication
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: ${{ needs.validate.outputs.quarto-version }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: quarto-site
          path: docs/_site/
      - uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: docs
          render: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
