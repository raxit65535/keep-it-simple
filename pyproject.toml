[project]
name = "keep-it-simple"
version = "0.1.0"
description = "Keep It Simple — a Quarto research portfolio and autonomous research-writing toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Raxit Solanki" }]

# Small authoring/validation dependencies. Quarto is installed separately.
dependencies = [
    "typer>=0.12.5",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.2",
    "pydantic>=2.9.2",
    "markdown-it-py>=3.0.0",
]

[dependency-groups]
# Default development and CI checks; no LLM dependencies.
dev = [
    "ruff>=0.6.9",
    "pytest>=8.3.3",
]

# Heavy agentic-research stack. Non-default group: installed only on request
# with `uv sync --group agent`. Never pulled into CI or deploys.
agent = [
    "langgraph>=0.2.28",
    "langchain>=0.3.1",
    "langchain-core>=0.3.6",
    "langchain-openai>=0.2.1",
    "langchain-ollama>=0.2.0",
    "arxiv>=2.1.3",
    "requests>=2.32.3",
    "bibtexparser>=1.4.1",
    "pydantic>=2.9.2",
    "python-slugify>=8.0.4",
    "pyyaml>=6.0.2",
]

[tool.uv]
# This repo is a blog + scripts, not a distributable package — don't build/install it.
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "quarto: integration with the pinned Quarto executable",
    "agent: integration with the optional LangGraph stack (no live model calls)",
]
